[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SAS_PCS_FITTER_KGOETZ91"
version = "0.0.1"
authors = [
    {name="Klaus Götz", email="klaus.klagoe.goetz@fau.de"}
]
description= "A package that uses sasmodels to simultaneously fit SAS and PCS data."
readme="README.md"
requires-python=">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "sasmodels",
    "scipy",
    "pandas",
    "bumps",
    "matplotlib",
    "pyside6",
    "pyqtgraph"
]

[project.urls]
Homepage = "https://github.com/ICSP-LKS/SAS_PCS_Fitter"
Issues = "https://github.com/ICSP-LKS/SAS_PCS_Fitter/issues"